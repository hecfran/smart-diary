<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account</title>
    <script src="domain.js"></script>
    <script src="demo-data.js"></script>
    <script src="demo.js"></script>
    <script>
        async function deleteAccount() {
            const urlParams = new URLSearchParams(window.location.search);
            const secret = urlParams.get('secret');
            const userId = urlParams.get('user_id');

            if (secret && userId) {
                const confirmation = confirm("Are you sure you want to delete your account? This action cannot be undone.");

                if (!confirmation) {
                    document.getElementById('result').innerText = 'Account deletion canceled by user.';
                    return;
                }

                try {
                    const response = await fetch(`${DOMAIN}/delete_account`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ secret: secret, user_id: userId })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        document.getElementById('result').innerText = 'Account deletion completed successfully!';
                    } else {
                        document.getElementById('result').innerText = `Error: ${result.msj}`;
                    }
                } catch (error) {
                    document.getElementById('result').innerText = 'An error occurred during account deletion.';
                }
            } else {
                document.getElementById('result').innerText = 'Missing secret or user ID.';
            }
        }

        window.onload = deleteAccount;
    </script>
    <script>window.onload = demoUnavailablePage; // Demo: no accounts exist, so nothing to delete.</script>
</head>
<body>
    <div id="demo_banner" role="note" style="background: #fff3cd; color: #4a3b00; border-bottom: 2px solid #e0c060; padding: 0.75rem 1rem; text-align: center; font-family: Arial, sans-serif; font-size: 1rem; line-height: 1.5;">This is the 2024 version of Hero&apos;s Diary, kept so anyone can see it. It runs as a demo with sample entries; nothing you type is sent anywhere or kept. The current diary is at <a href="https://herosdiary.com" style="color: #1a4fa0; font-weight: bold;">herosdiary.com</a>.</div>
    <h1>Delete Account</h1>
    <p id="result">Preparing account deletion...</p>
</body>
</html>

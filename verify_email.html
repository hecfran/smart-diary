<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
	<script src="domain.js"></script>		
	<script src="demo-data.js"></script>
	<script src="demo.js"></script>
    <script>
        async function verifyEmail() {
            const urlParams = new URLSearchParams(window.location.search);
            const secret = urlParams.get('secret');
            const userId = urlParams.get('user_id');

            if (secret && userId) {
                try {
                    const response = await fetch(`${DOMAIN}/verify_email?secret=${encodeURIComponent(secret)}&user_id=${encodeURIComponent(userId)}`);
                    const result = await response.json();

                    if (response.ok) {
                        document.getElementById('result').innerText = 'Email verification successful!';
                    } else {
                        document.getElementById('result').innerText = `Error: ${result.Error}`;
                    }
                } catch (error) {
                    document.getElementById('result').innerText = 'An error occurred during verification.';
                }
            } else {
                document.getElementById('result').innerText = 'Missing secret or user ID.';
            }
        }

        window.onload = verifyEmail;
    </script>
    <script>window.onload = demoUnavailablePage; // Demo: no accounts exist, so nothing to verify.</script>
</head>
<body>
    <div id="demo_banner" role="note" style="background: #fff3cd; color: #4a3b00; border-bottom: 2px solid #e0c060; padding: 0.75rem 1rem; text-align: center; font-family: Arial, sans-serif; font-size: 1rem; line-height: 1.5;">This is the 2024 version of Hero&apos;s Diary, kept so anyone can see it. It runs as a demo with sample entries; nothing you type is sent anywhere or kept. The current diary is at <a href="https://herosdiary.com" style="color: #1a4fa0; font-weight: bold;">herosdiary.com</a>.</div>
    <h1>Email Verification</h1>
    <p id="result">Verifying...</p>
</body>
</html>
